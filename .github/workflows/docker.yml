# Build the wattsim image on every push and pull request without pushing it, then start it and wait for its
# HEALTHCHECK.
name: docker
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: wattsim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name wattsim -p 7700:7700 wattsim:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' wattsim)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' wattsim | grep -qx healthy
          curl -fsS http://127.0.0.1:7700/api/health
      - if: failure()
        run: docker logs wattsim || true
